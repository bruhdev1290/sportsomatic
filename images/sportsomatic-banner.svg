<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077B6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#grad1)"/>
  
  <!-- Watch icon -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="45" fill="#fff" opacity="0.9"/>
    <circle cx="0" cy="0" r="40" fill="#333"/>
    <rect x="-35" y="-50" width="70" height="10" rx="5" fill="#fff" opacity="0.7"/>
    <rect x="-35" y="40" width="70" height="10" rx="5" fill="#fff" opacity="0.7"/>
    <!-- Screen content -->
    <text x="0" y="-8" font-family="Arial, sans-serif" font-size="14" fill="#00B4D8" font-weight="bold" text-anchor="middle">RUN</text>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">5.2</text>
    <text x="0" y="20" font-family="Arial, sans-serif" font-size="10" fill="#90CAF9" text-anchor="middle">km</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="52" fill="#fff" font-weight="bold" text-anchor="middle">SPORTSOMATIC</text>
  <text x="400" y="115" font-family="Arial, sans-serif" font-size="18" fill="#E0F7FA" text-anchor="middle">Fitness Tracking for Pebble</text>
  <text x="400" y="140" font-family="Arial, sans-serif" font-size="14" fill="#B2EBF2" text-anchor="middle">🏃 Running • 🏊 Swimming • 📊 Live Stats</text>
  
  <!-- Running icon -->
  <g transform="translate(620, 100)">
    <circle cx="0" cy="-20" r="8" fill="#fff"/>
    <path d="M 0 -12 L 0 10" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 0 L -10 15" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 10 L 10 25" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 0 -5 L 12 5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
