<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Title -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="24" fill="#2C3E50" font-weight="bold" text-anchor="middle">Button Controls Reference</text>
  
  <!-- Watch outline in center -->
  <g transform="translate(300, 200)">
    <rect x="-60" y="-84" width="120" height="168" rx="15" fill="#2C3E50" stroke="#34495E" stroke-width="2"/>
    <rect x="-56" y="-64" width="112" height="128" fill="#111"/>
    
    <!-- Screen content -->
    <text x="0" y="-40" font-family="Arial, sans-serif" font-size="10" fill="#FFD700" font-weight="bold" text-anchor="middle">RUN - Main</text>
    <text x="0" y="-10" font-family="Arial, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">15:42</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="10" fill="#FFD700" font-weight="bold" text-anchor="middle">3.24 km</text>
    <text x="0" y="40" font-family="Arial, sans-serif" font-size="9" fill="#4CAF50" font-weight="bold" text-anchor="middle">4:51 /km</text>
    
    <!-- Buttons -->
    <rect x="-72" y="-40" width="12" height="15" rx="2" fill="#E74C3C"/>
    <rect x="-72" y="-5" width="12" height="15" rx="2" fill="#3498DB"/>
    <rect x="-72" y="30" width="12" height="15" rx="2" fill="#9B59B6"/>
    <rect x="60" y="-5" width="12" height="15" rx="2" fill="#27AE60"/>
  </g>
  
  <!-- UP button - Left top -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#E74C3C" opacity="0.9"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">UP Button</text>
    <text x="70" y="43" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">Mark Lap (Run)</text>
    <text x="70" y="56" font-family="Arial, sans-serif" font-size="9" fill="#FFCCCB" text-anchor="middle">(not used in Swim)</text>
  </g>
  
  <!-- SELECT button - Right top -->
  <g transform="translate(460, 100)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#27AE60" opacity="0.9"/>
    <text x="70" y="22" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">SELECT</text>
    <text x="70" y="38" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">Start/Pause/Resume</text>
    <text x="70" y="56" font-family="Arial, sans-serif" font-size="10" fill="#CCFFCC" text-anchor="middle">Long Press:</text>
    <text x="70" y="70" font-family="Arial, sans-serif" font-size="10" fill="#CCFFCC" text-anchor="middle">Change Sport Mode</text>
  </g>
  
  <!-- DOWN button - Left middle -->
  <g transform="translate(100, 210)">
    <rect x="0" y="0" width="140" height="60" rx="8" fill="#3498DB" opacity="0.9"/>
    <text x="70" y="25" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">DOWN Button</text>
    <text x="70" y="43" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">Switch Data View</text>
    <text x="70" y="56" font-family="Arial, sans-serif" font-size="9" fill="#CCE5FF" text-anchor="middle">Main • Lap • HR • Splits</text>
  </g>
  
  <!-- BACK button - Right middle -->
  <g transform="translate(460, 210)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#9B59B6" opacity="0.9"/>
    <text x="70" y="22" font-family="Arial, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">BACK</text>
    <text x="70" y="38" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">Show Help Tip</text>
    <text x="70" y="56" font-family="Arial, sans-serif" font-size="10" fill="#E6D5F5" text-anchor="middle">Long Press:</text>
    <text x="70" y="70" font-family="Arial, sans-serif" font-size="10" fill="#E6D5F5" text-anchor="middle">End Workout</text>
  </g>
  
  <!-- Quick tips at bottom -->
  <rect x="50" y="320" width="500" height="60" rx="8" fill="#34495E" opacity="0.9"/>
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="12" fill="#FFD700" font-weight="bold" text-anchor="middle">💡 Quick Tips</text>
  <text x="300" y="356" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">• Auto-start begins tracking when movement detected</text>
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle">• Vibration alerts at each km/mile (configurable)</text>
</svg>
