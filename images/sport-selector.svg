<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 168">
  <!-- Pebble watch face outline -->
  <rect x="12" y="0" width="120" height="168" rx="15" fill="#000"/>
  <rect x="16" y="20" width="112" height="128" fill="#fff"/>
  
  <!-- Menu items -->
  <!-- Run option (highlighted) -->
  <rect x="16" y="20" width="112" height="44" fill="#000"/>
  <text x="22" y="38" font-family="Arial, sans-serif" font-size="12" fill="#fff" font-weight="bold">Run</text>
  <text x="22" y="54" font-family="Arial, sans-serif" font-size="8" fill="#ccc">Outdoor running</text>
  
  <!-- Swim option -->
  <rect x="16" y="64" width="112" height="44" fill="#fff"/>
  <text x="22" y="82" font-family="Arial, sans-serif" font-size="12" fill="#000" font-weight="bold">Swim</text>
  <text x="22" y="98" font-family="Arial, sans-serif" font-size="8" fill="#666">Pool swim (laps)</text>
  
  <!-- Menu separator lines -->
  <line x1="16" y1="64" x2="128" y2="64" stroke="#ddd" stroke-width="1"/>
  <line x1="16" y1="108" x2="128" y2="108" stroke="#ddd" stroke-width="1"/>
  
  <!-- Icons -->
  <!-- Running icon -->
  <g transform="translate(112, 42)">
    <circle cx="0" cy="-8" r="3" fill="#fff"/>
    <path d="M 0 -5 L 0 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 0 0 L -3 6" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 0 3 L 3 9" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 0 -2 L 4 2" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
  
  <!-- Swimming icon -->
  <g transform="translate(112, 86)">
    <circle cx="-8" cy="0" r="2" fill="#333"/>
    <path d="M -6 0 Q -2 -4, 2 -2 T 8 0" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M -3 2 Q 0 0, 3 2 T 9 2" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Hardware buttons -->
  <rect x="0" y="40" width="12" height="15" rx="2" fill="#333"/>
  <rect x="0" y="75" width="12" height="15" rx="2" fill="#333"/>
  <rect x="0" y="110" width="12" height="15" rx="2" fill="#333"/>
  <rect x="132" y="75" width="12" height="15" rx="2" fill="#333"/>
</svg>
