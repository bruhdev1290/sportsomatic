<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 168">
  <!-- Pebble watch face outline -->
  <rect x="12" y="0" width="120" height="168" rx="15" fill="#000"/>
  <rect x="16" y="20" width="112" height="128" fill="#111"/>
  
  <!-- Title bar -->
  <text x="72" y="40" font-family="Arial, sans-serif" font-size="10" fill="#FFD700" font-weight="bold" text-anchor="middle">READY</text>
  
  <!-- Divider -->
  <line x1="16" y1="44" x2="128" y2="44" stroke="#444" stroke-width="1"/>
  
  <!-- Main time display card -->
  <rect x="20" y="50" width="104" height="40" rx="4" fill="none" stroke="#0096FF" stroke-width="2"/>
  <text x="72" y="75" font-family="Arial, sans-serif" font-size="24" fill="#fff" font-weight="bold" text-anchor="middle">00:00</text>
  
  <!-- Distance card -->
  <rect x="20" y="95" width="104" height="22" rx="4" fill="none" stroke="#FFD700" stroke-width="2"/>
  <text x="72" y="110" font-family="Arial, sans-serif" font-size="12" fill="#FFD700" font-weight="bold" text-anchor="middle">0.00 km</text>
  
  <!-- Pace card -->
  <rect x="20" y="120" width="104" height="22" rx="10" fill="none" stroke="#4CAF50" stroke-width="2"/>
  <text x="72" y="135" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50" font-weight="bold" text-anchor="middle">--:--</text>
  
  <!-- Footer text -->
  <text x="72" y="156" font-family="Arial, sans-serif" font-size="7" fill="#999" text-anchor="middle">Hold SELECT to change mode</text>
  
  <!-- Page dots -->
  <circle cx="58" cy="162" r="2" fill="#666"/>
  <circle cx="68" cy="162" r="2" fill="#fff"/>
  <circle cx="78" cy="162" r="2" fill="#666"/>
  <circle cx="88" cy="162" r="2" fill="#666"/>
  
  <!-- Hardware buttons -->
  <rect x="0" y="40" width="12" height="15" rx="2" fill="#333"/>
  <rect x="0" y="75" width="12" height="15" rx="2" fill="#333"/>
  <rect x="0" y="110" width="12" height="15" rx="2" fill="#333"/>
  <rect x="132" y="75" width="12" height="15" rx="2" fill="#333"/>
</svg>
